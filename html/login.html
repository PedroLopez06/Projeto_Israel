<main>

<h2>Entrar na sua conta</h2>

<form action="inicio.html" method="get">

<fieldset>
<legend>Acesso</legend>

<label for="email-login">E-mail:</label><br />
<input type="email" id="email-login" name="email" placeholder="exemplo@email.com" required /><br /><br />

<label for="senha-login">Senha:</label><br />
<input type="password" id="senha-login" name="senha" placeholder="Sua senha" required /><br /><br />

<input type="checkbox" id="lembrar" name="lembrar" />
<label for="lembrar">Lembrar de mim neste dispositivo</label>

</fieldset>

<br />
<input type="submit" value="Entrar" />

</form>

<p>Ainda nao tem conta? <a href="cadastro.html">Cadastre-se aqui</a>.</p>
